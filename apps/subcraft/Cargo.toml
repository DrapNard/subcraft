[package]
name = "subcraft"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "subcraft"
path = "src/main.rs"

[features]
# Packaged Windows builds: run as a GUI app (no console window). `scripts/build-windows.ps1` enables it.
windows-gui = []
spp-worker = ["subcraft-app/spp-worker"]
update-fixture = ["subcraft-ui/update-fixture", "subcraft-app/update-fixture"]

[dependencies]
subcraft-ui.workspace = true
subcraft-app.workspace = true
subcraft-render.workspace = true
glam.workspace = true
image.workspace = true
eframe.workspace = true
log.workspace = true
anyhow.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Web build: browser randomness for ids and hashing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
