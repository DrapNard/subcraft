[package]
name = "subcraft-project"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true

[lints]
workspace = true

[features]
# Experimental native container research; default/community and browser builds stay independent.
spp-hdf5 = ["dep:hdf5", "dep:hdf5-sys", "dep:sha2"]
spp-worker = ["spp-hdf5", "dep:libc"]
spp-hdf5-static = ["spp-hdf5", "hdf5/static"]

[dependencies]
subcraft-core.workspace = true
subcraft-image.workspace = true
subcraft-mesh.workspace = true
subcraft-doc.workspace = true
glam.workspace = true
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zip.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hdf5 = { package = "hdf5-metno", version = "=0.14.1", optional = true, default-features = false }
hdf5-sys = { package = "hdf5-metno-sys", version = "=0.12.3", optional = true, default-features = false }
sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
